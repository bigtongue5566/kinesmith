[project]
name = "kinesmith"
version = "0.1.0"
description = "Agent-native motion graphics studio for Codex and Claude Code"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pillow>=11,<13",
  "imageio-ffmpeg>=0.6,<1", "playwright>=1.55,<2",
  "jsonschema>=4.23,<5", "PyYAML>=6,<7", "mido>=1.3,<2", "soundfile>=0.13,<1",
]

[project.optional-dependencies]
manim = ["manim>=0.19,<0.20"]
blender = ["bpy==4.2.0"]

[project.scripts]
kinesmith = "kinesmith.cli:main"

[project.urls]
Homepage = "https://github.com/bigtongue5566/kinesmith"
Repository = "https://github.com/bigtongue5566/kinesmith"
Issues = "https://github.com/bigtongue5566/kinesmith/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".cache", ".venv", "dist", "vendor", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
