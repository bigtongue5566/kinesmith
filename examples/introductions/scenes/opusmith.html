<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Opusmith / 把想法寫成音樂</title>
<style>body{margin:0}canvas{display:block}</style><canvas id="stage"></canvas>
<script type="module">
import {fontReady,surface,text,rect,line,dot,reveal,footer,ease,clamp,arrow,check} from './drawing.js';
const canvas=document.querySelector('#stage');
const C={ink:'#211e1a',paper:'#f4eddf',gold:'#e6ae55',red:'#b84a37',soft:'#a99e8e',green:'#9cc5a4',white:'#fffaf0'};
let music;
window.kinesmithReady=Promise.all([fontReady,fetch('/data/opusmith-music.json').then(r=>r.json()).then(d=>music=d)]);
const headers=['','一句想法，拆成音樂決定。','音符、力度、段落，都能編輯。','音色，也是一份可調的設計。',
 '從旋律，到完整分軌。','歌詞與人聲，留在可調的工程。','修改一小段，保留其他聲部。','音樂與畫面，一起完成。'];
function roll(g,notes,start,x,y,w,h,t,color){
 rect(g,x,y,w,h,12,'#332f29');
 for(let n=0;n<=16;n++){const xx=x+n*w/16;line(g,xx,y+8,xx,y+h-8,n%4===0?'#635a4d':'#413b32',1)}
 for(let p=40;p<=88;p+=6){const yy=y+h-(p-36)/54*h;line(g,x+8,yy,x+w-8,yy,'#413b32',1)}
 const end=start+16,now=start+t*160/60;
 for(const n of notes){if(n.start<start||n.start>=end)continue;
  const xx=x+(n.start-start)/16*w,yy=y+h-(n.pitch-36)/54*h;
  const active=now>=n.start&&now<n.start+n.duration;
  rect(g,xx,yy-6,Math.max(7,n.duration/16*w-2),12,4,active?C.white:color);
 }
 const play=x+clamp(t/6)*w;line(g,play,y+8,play,y+h-8,C.white,2);
}
function record(g,x,y,r,t){
 dot(g,x,y,r,C.ink);g.save();g.translate(x,y);g.rotate(t*.65);
 for(let i=0;i<13;i++){g.beginPath();g.arc(0,0,r*(.41+i*.041),.17,5.98);g.strokeStyle=i%3===0?'#756346':'#40382c';g.lineWidth=1.5;g.stroke()}
 dot(g,0,0,r*.31,C.gold);dot(g,0,0,r*.05,C.ink);line(g,-r*.13,-r*.13,r*.13,r*.13,C.ink,6);g.restore();
}
window.renderFrame=(frame,ctx)=>{
 const g=surface(canvas,ctx),s=ctx.params.chapter,t=Math.min(ctx.time,s===7?3:6),globalTime=s*6+t;
 const dark=[0,2,4,6].includes(s),paper=s===5?C.red:dark?C.ink:C.paper,ink=s===5?C.white:dark?C.paper:C.ink;
 rect(g,0,0,1280,720,0,paper);
 if(s>0){text(g,`OPUSMITH / ${['','INTENT','SCORE','SOUND DESIGN','MIX & STEMS','OPTIONAL VOCALS','REVISION','AUDIO × VISUAL'][s]}`,64,62,16,s===5?C.white:dark?C.gold:C.red,650);
  reveal(g,t,0,()=>text(g,headers[s],64,147,48,ink,750));}
 if(s===0){
  text(g,'AGENTIC MUSIC PRODUCTION',64,66,17,C.gold,650);
  reveal(g,t,.05,()=>text(g,'Opusmith',59,270,108,C.paper,800));
  reveal(g,t,.35,()=>text(g,'把想法，',64,377,58,C.gold,700));
  reveal(g,t,.55,()=>text(g,'寫成音樂。',64,458,58,C.gold,700));
  reveal(g,t,.9,()=>text(g,'Codex × Claude Code 的音樂創作 Plugin',64,547,26,C.paper,500));
  reveal(g,t,1.15,()=>text(g,'Craft music, not just generate it.',64,590,24,C.soft,450));
  const p=ease((t-.15)/1.2);g.save();g.translate((1-p)*220,0);record(g,1000,355,218,t);g.restore();
 }
 if(s===1){
  reveal(g,t,.25,()=>{rect(g,64,200,1152,112,12,C.white);text(g,'「做一段有旋律、帶碎拍的原創配樂。」',100,272,37,C.ink,550)});
  const labels=['動機','和聲','段落','音色'],small=['先有可記住的樂句','安排張力與解決','設計進出與留白','選擇聲部的性格'];
  for(let i=0;i<4;i++){const x=211+i*285,p=ease((t-.65-i*.18)/.7);if(i<3)arrow(g,x+68,420,x+214,420,C.soft,2);
   g.save();g.globalAlpha=p;g.translate(0,24*(1-p));dot(g,x,420,53,i===3?C.red:C.ink);text(g,String(i+1).padStart(2,'0'),x,437,36,C.paper,600,'center');
   text(g,labels[i],x,519,32,C.ink,650,'center');text(g,small[i],x,560,19,C.soft,500,'center');g.restore();}
  reveal(g,t,1.8,()=>text(g,'由目前 Agent 創作；不另呼叫整曲生成服務。',640,622,24,C.red,550,'center'));
 }
 if(s===2){
  text(g,'本片實際 Score｜第 32–48 拍',64,207,24,C.gold,550);
  roll(g,music.tracks.find(r=>r.id==='pluck').notes,32,64,245,1152,272,t,C.gold);
  const tags=['音高 Pitch','起點 Timing','力度 Velocity','JSON + MIDI'];
  tags.forEach((label,i)=>reveal(g,t,.4+i*.13,()=>{rect(g,64+i*294,551,270,48,10,'#383127');text(g,label,199+i*294,583,22,C.paper,500,'center')}));
  text(g,'標準 MIDI 保存音符；音色與效果另留在 Score、Python。',64,638,23,C.soft,450);
 }
 if(s===3){
  text(g,'本片 Pluck patch｜原生合成，沒有取樣。',64,206,25,C.red,550);
  const p=ease((t-.15)/1.0);g.save();g.beginPath();g.rect(64,237,1152*p,174);g.clip();
  g.beginPath();for(let i=0;i<=900;i++){const x=64+i*1.28,phase=i/900*Math.PI*12;
   const y=320+Math.sin(phase)*Math.exp(-(i%150)/105)*62+Math.sin(phase*2)*13;
   if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=C.red;g.lineWidth=4;g.stroke();g.restore();
  const labels=['Cutoff · 3200 Hz','Decay · 0.18 s','Release · 0.22 s'];
  for(let i=0;i<3;i++){const x=258+i*380;dot(g,x,483,47,C.ink);const angle=-2.5+ease((t-.5-i*.12)/.8)*3.8;
   line(g,x,483,x+29*Math.sin(angle),483-29*Math.cos(angle),C.gold,6);text(g,labels[i],x,575,24,C.ink,600,'center');}
  text(g,'合成器視覺示意｜實際參數、ADSR 與效果保存在可編輯專案。',640,637,22,C.soft,450,'center');
 }
 if(s===4){
  for(let i=0;i<music.tracks.length;i++){const tr=music.tracks[i],y=221+i*49;
   text(g,tr.id.toUpperCase(),64,y+18,20,C.paper,600);rect(g,218,y,705,24,6,'#383127');
   const k=Math.min(tr.energy.length-1,Math.floor(globalTime*20)),energy=Math.sqrt(tr.energy[k]||0);
   rect(g,218,y,Math.max(3,705*clamp(energy*2.5)),24,6,i<4?C.gold:C.red);
   for(let j=0;j<10;j++)line(g,218+j*70.5,y,218+j*70.5,y+24,C.ink,2);
  }
  reveal(g,t,.4,()=>{record(g,1090,375,108,t);text(g,'MASTER',1090,534,23,C.gold,600,'center')});
  text(g,'七軌原生音訊能量｜同起點 Stems，可獨立混音。',64,622,25,C.paper,550);
 }
 if(s===5){
  reveal(g,t,.2,()=>text(g,'OpenUtau',64,291,65,C.white,750));
  reveal(g,t,.45,()=>text(g,'傳統 UTAU ／ DiffSinger',67,351,28,C.paper,550));
  reveal(g,t,.8,()=>text(g,'歌詞、音高、表情與 USTX 來源',67,423,28,C.paper,550));
  reveal(g,t,1.05,()=>text(g,'保留在可以繼續調聲的工程。',67,472,28,C.paper,500));
  rect(g,695,214,521,304,16,C.paper);text(g,'USTX',725,256,22,C.red,700);
  const syllables=['把','想','法','寫','成','歌'];
  for(let i=0;i<6;i++){const x=726+i*74,p=ease((t-.5-i*.11)/.65),y=342-[0,1,2,1,3,2][i]*16;
   rect(g,x,y+(1-p)*60,62,43,7,C.red);g.save();g.globalAlpha=p;text(g,syllables[i],x+31,y+29,24,C.white,650,'center');g.restore();}
  text(g,'編輯介面示意｜本片配樂無歌聲',955,474,19,C.red,550,'center');
  text(g,'可選人聲另需聲庫；聲庫、聲碼器與素材授權需分別核對。',640,610,24,C.white,550,'center');
 }
 if(s===6){
  text(g,'本片配樂實際修訂｜第 96–100 拍 Pluck 降八度',64,207,24,C.gold,550);
  text(g,'v001',64,264,21,C.soft,500);roll(g,music.original_pluck,96,64,281,800,110,t,C.soft);
  text(g,'v002',64,436,21,C.gold,600);roll(g,music.tracks.find(r=>r.id==='pluck').notes,96,64,453,800,110,t,C.gold);
  reveal(g,t,.65,()=>{text(g,'6',1050,364,112,C.green,750,'center');text(g,'軌保持相同',1050,422,28,C.paper,600,'center');check(g,1050,480,C.green,1.5)});
  text(g,'六個未修改 Stems 的 SHA256 實測相同；保存 v001 與 v002。',64,624,23,C.soft,450);
 }
 if(s===7){
  reveal(g,t,.2,()=>{text(g,'Opusmith',640,284,91,C.ink,800,'center');text(g,'可編輯的音樂',640,325,24,C.red,550,'center')});
  const p=ease((t-.55)/.7);line(g,640,346,640,346+45*p,C.red,3);
  reveal(g,t,.8,()=>{text(g,'Kinesmith',640,462,66,C.ink,750,'center');text(g,'可編輯的動畫',640,502,24,C.red,550,'center')});
  reveal(g,t,1.25,()=>text(g,'Skills 協調、資料交接，保留版本關聯。',640,563,26,C.ink,550,'center'));
  reveal(g,t,1.5,()=>text(g,'github.com/bigtongue5566/opusmith',640,611,24,C.red,550,'center'));
  text(g,'功能依 v0.2.0 查核｜2026.10.25',640,647,17,C.soft,450,'center');
 }
 footer(g,'OPUSMITH / CRAFT MUSIC, NOT JUST GENERATE IT.',s,s===7&&t>=3?6:ctx.time,dark?'#514638':s===5?'#d57962':'#d9cdb9',ink);
};
</script></html>
