<!doctype html><html lang="en"><meta charset="utf-8"><title>Kinesmith / Dimensional</title>
<style>html,body{margin:0;background:#101c2e}canvas{display:block}</style><canvas id="stage"></canvas>
<script type="module">
import * as THREE from '/vendor/three/three.module.min.js';
const canvas=document.querySelector('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setClearColor('#101c2e',1);renderer.outputColorSpace=THREE.SRGBColorSpace;

</script></html>
